version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logsentry-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./reports:/reports
      - ./sample_logs:/sample_logs
    environment:
      - PROJECT_NAME=LOGSENTRY — Log Analyzer & Attack Detection System
      - DATABASE_URL=sqlite:////app/data/logsentry.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logsentry-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: logsentry-network
